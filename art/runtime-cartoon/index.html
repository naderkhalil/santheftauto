<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>San Theft Auto — cartoon game review</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:#18221f;color:#f5f2e9;font-family:system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}h1{font-size:22px;margin:0 0 8px}p{margin:0;font-size:13px;color:#b3c2b9}nav{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button,select{background:#263a30;color:#eef2e8;border:1px solid #647a6c;border-radius:7px;font:inherit;font-size:13px;padding:10px 14px;cursor:pointer}button[aria-pressed=true]{background:#d5f66a;color:#18221f;border-color:#d5f66a}button:focus-visible,select:focus-visible{outline:3px solid #d5f66a;outline-offset:3px}.viewer{height:min(70vh,780px);min-height:320px;border-radius:14px;overflow:hidden;background:#e8e6de}canvas{display:block;width:100%;height:100%;touch-action:none}footer{display:flex;justify-content:space-between;gap:15px;margin-top:14px;font-size:12px;color:#b3c2b9}@media(max-width:620px){main{padding:14px}header{display:block}.viewer{height:63vh}footer{display:block;line-height:1.6}}
    </style>
  </head>
  <body>
    <main>
      <header><div><h1>Cartoon game review</h1><p>Optimized 3D characters, portrait lighting, and the playable roadster.</p></div><label>Character <select id="driver" aria-label="Character"></select></label></header>
      <nav aria-label="Review view"><button id="portrait" type="button">Portrait</button><button id="car" type="button">In the car</button><button id="front" type="button">Front</button><button id="three-quarter" type="button">Three-quarter</button><button id="side" type="button">Side</button><button id="back" type="button">Back</button></nav>
      <div class="viewer"><canvas id="review" aria-label="Interactive 3D character and car review"></canvas></div>
      <footer><span id="status" role="status">Opening the staged character kit…</span><span>Drag to rotate · This review does not change the live game.</span></footer>
    </main>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
