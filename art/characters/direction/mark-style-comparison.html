<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Mark Zuckerberg — Character direction comparison</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #272b29; background: #f6f5f0; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1800px, 100%); margin: 0 auto; padding: clamp(24px, 4vw, 64px); }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 36px; }
    .eyebrow { margin: 0 0 12px; color: #687069; font-size: 11px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font: 400 clamp(30px, 3.5vw, 52px)/1.1 Georgia, "Times New Roman", serif; letter-spacing: -.035em; }
    .intro { max-width: 330px; margin: 0 0 3px; color: #606861; font-size: 13px; line-height: 1.65; }
    .studies { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(18px, 2.5vw, 36px); }
    figure { min-width: 0; margin: 0; }
    .study-heading { display: flex; align-items: baseline; gap: 12px; padding: 15px 0; border-top: 1px solid #cccec5; }
    .number { color: #858c82; font-size: 11px; font-variant-numeric: tabular-nums; }
    h2 { margin: 0; font-size: 19px; font-weight: 550; letter-spacing: -.02em; }
    .frame { position: relative; display: grid; place-items: center; aspect-ratio: 3 / 2; overflow: hidden; background: #e9e7df; border: 1px solid #272b2910; border-radius: 3px; }
    .frame img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .image-status { position: absolute; inset: 0; display: grid; place-content: center; margin: 0; padding: 24px; color: #70766e; font-size: 13px; line-height: 1.6; text-align: center; }
    .image-status[hidden], .full-resolution[hidden] { display: none; }
    figure[data-state="unavailable"] img { visibility: hidden; }
    figcaption { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; padding: 14px 0; color: #737970; font-size: 11px; line-height: 1.6; }
    a { color: #414c43; text-underline-offset: 4px; text-decoration-thickness: 1px; }
    a:hover { color: #111c14; }
    a:focus-visible { outline: 2px solid #49644d; outline-offset: 5px; border-radius: 1px; }
    footer { margin-top: 28px; padding-top: 18px; border-top: 1px solid #dfe0d8; color: #777d74; font-size: 11px; line-height: 1.65; }
    @media (max-width: 800px) {
      header { display: block; margin-bottom: 28px; }
      .intro { max-width: 440px; margin-top: 18px; }
      .studies { grid-template-columns: 1fr; gap: 24px; }
      footer { margin-top: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">San Theft Auto / Art direction</p>
        <h1>Mark, in two styles.</h1>
      </div>
      <p class="intro">The same character, wardrobe, and relaxed expression. Compare the face, proportions, and overall feel.</p>
    </header>

    <section class="studies" aria-label="Character concept comparison">
      <figure data-state="loading">
        <div class="study-heading"><span class="number" aria-hidden="true">01</span><h2>Painted</h2></div>
        <div class="frame">
          <img src="mark-concept-v2.png" width="1536" height="1024" decoding="async" alt="Painted concept sheet of Mark Zuckerberg with a large angled portrait, a front-facing portrait, and a full-body study in a charcoal T-shirt, jeans, and off-white sneakers.">
          <p class="image-status" role="status">Loading painted study…</p>
        </div>
        <figcaption>
          <span>Mark Zuckerberg · Character concept</span>
          <a class="full-resolution" href="mark-concept-v2.png" target="_blank" rel="noopener" aria-label="Open painted concept at full resolution in a new tab">Open full resolution ↗</a>
        </figcaption>
      </figure>

      <figure data-state="loading">
        <div class="study-heading"><span class="number" aria-hidden="true">02</span><h2>Cartoon</h2></div>
        <div class="frame">
          <img src="mark-concept-cartoon-v1.png" width="1536" height="1024" decoding="async" alt="Cartoon concept sheet of Mark Zuckerberg, showing portrait and full-body character studies.">
          <p class="image-status" role="status">Loading cartoon study…</p>
        </div>
        <figcaption>
          <span>Mark Zuckerberg · Character concept</span>
          <a class="full-resolution" href="mark-concept-cartoon-v1.png" target="_blank" rel="noopener" aria-label="Open cartoon concept at full resolution in a new tab">Open full resolution ↗</a>
        </figcaption>
      </figure>
    </section>

    <footer>Concept directions for review. These images establish the visual target; they are not finished 3D models or in-game renders.</footer>
  </main>
  <script>
    for (const study of document.querySelectorAll('figure')) {
      const image = study.querySelector('img');
      const status = study.querySelector('.image-status');
      const link = study.querySelector('.full-resolution');
      const update = () => {
        const loaded = image.naturalWidth > 0;
        study.dataset.state = loaded ? 'ready' : 'unavailable';
        status.hidden = loaded;
        link.hidden = !loaded;
        if (!loaded) status.textContent = 'This concept image is not available yet. Refresh when it is ready.';
      };
      image.addEventListener('load', update);
      image.addEventListener('error', update);
      if (image.complete) update();
    }
  </script>
</body>
</html>
